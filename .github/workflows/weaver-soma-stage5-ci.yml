name: weaver-soma-stage5-cpu-ci

# Research-only checks. No training checkpoint, motor control, deployment or secrets.
on:
  push:
    branches:
      - feature/weaver-soma-stage5-long-world-sensing
    paths:
      - 'Weaver-Soma/**'
      - '.github/workflows/weaver-soma-stage5-ci.yml'
  pull_request:
    paths:
      - 'Weaver-Soma/**'
      - '.github/workflows/weaver-soma-stage5-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: weaver-soma-stage5-ci
  cancel-in-progress: true

jobs:
  stage5-sensor-cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.26' 'scikit-learn>=1.4' 'pytest>=8'
      - name: Test Stage 5 world-model + SOMA-SENSE V2 telemetry
        env:
          PYTHONPATH: Weaver-Soma/U1:Weaver-Soma/U2:Weaver-Soma/Sensors:Weaver-Soma/Sensors/V2
        run: python -m pytest -q Weaver-Soma/U2/test_stage5.py Weaver-Soma/Sensors/V2/test_sensor_v2.py
