<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />
<title>Weaver - Headless</title>

    border-radius: 8px;
    backdrop-filter: blur(14px);
    box-shadow: 0 22px 80px rgba(0, 0, 0, 0.34);

    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.12);

  button:disabled { opacity: 0.45; cursor: not-allowed; }

    background: rgba(255,255,255,0.055);
    color: var(--text);

    .top { left: 12px; top: 12px; width: calc(100vw - 24px); }
    .bar {
      left: 12px;
      right: 12px;
      bottom: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .bar button { width: 100%; padding: 0 8px; }
    #text { grid-column: 1 / span 2; }
    #send { grid-column: 3; }
    #dream { display: none; }
    h1 { letter-spacing: 0.14em; }
  }
</style>
</head>
<body>

  <button id="send" type="submit" class="primary">Send</button>
  <button id="dream" type="button">Dream</button>

function compact(value, max = 280) {

function configurePerformance() {

function voiceScore(voice) {
  const haystack = `${voice.name} ${voice.voiceURI} ${voice.lang}`.toLowerCase();
  let score = 0;
  if (/^en[-_]/.test((voice.lang || '').toLowerCase())) score += 40;
  if (/aria|jenny|samantha|ava|allison|susan|victoria|karen|zira/.test(haystack)) score += 35;
  if (/google (us|uk) english|natural|neural|premium|enhanced/.test(haystack)) score += 25;
  if (/female/.test(haystack)) score += 12;
  if (/daniel|david|mark|george|male/.test(haystack)) score -= 12;

}
function pickBrowserVoice() {
  return browserVoices()
    .slice()
    .sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name))[0] || null;
}
function waitForBrowserVoices() {
  if (!canUseBrowserSpeech() || browserVoices().length) return Promise.resolve();

    const done = () => {
      speechSynthesis.removeEventListener?.('voiceschanged', done);
      resolve();

    speechSynthesis.addEventListener?.('voiceschanged', done, { once: true });
    setTimeout(done, 800);

      gain.gain.value = 0.00001;

    const size = (1.2 + p.z * 3.6 + state.pulse * 3.5) * state.dpr;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, ${p.hue === 42 ? 72 : 88}%, ${58 + p.z * 18}%, ${0.18 + p.z * 0.48})`;
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = `rgba(225,186,88,${0.12 + state.pulse * 0.18})`;
  ctx.lineWidth = 1 * state.dpr;
  const rings = state.reducedMotion ? 1 : state.lowPower ? 2 : 4;
  for (let i = 0; i < rings; i++) {
    const r = Math.min(w, h) * (0.16 + i * 0.095 + state.pulse * 0.03);
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.75, r * 0.52, state.phase * 0.05 + i * 0.28, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
  startDraw();
}
async function pollState() {
  try {
    const s = await brainFetch('/brain/state');
    state.lastState = s;
    ui.stamp.textContent = `${Math.max(0, Math.round(s.uptime_seconds || 0))}s active`;
    ui.thoughts.textContent = `${s.thoughts || 0} thoughts`;
    ui.dreams.textContent = `${s.dreams || 0} dreams`;
    ui.lastThought.textContent = compact(s.last_thought || 'none yet', 220);
    ui.lastDream.textContent = compact(s.last_dream || 'none yet', 360);
    dot(ui.brainDot, 'on');
    dot(ui.thoughtDot, s.last_thought ? 'on' : '');
    dot(ui.dreamDot, s.last_dream ? 'on' : '');
    ui.brain.textContent = HEADLESS_MODEL_LABEL;
  } catch (e) {
    ui.brain.textContent = e.message;
    dot(ui.brainDot, '');
  }
}
function schedulePoll(delay = document.hidden ? 20000 : 5000) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    await pollState();
    schedulePoll();
  }, delay);
}
async function checkModels() {
  try {
    const m = await brainFetch('/brain/v1/models');
    const ids = (m.data || []).map(x => x.id);
    ui.brain.textContent = ids.includes(HEADLESS_MODEL) ? HEADLESS_MODEL_LABEL : 'brain online';
    dot(ui.brainDot, 'on');
  } catch (e) {
    ui.brain.textContent = e.message;
    dot(ui.brainDot, '');
  }
}
async function browserSpeak(text, retried = false, runId = state.speechRun) {
  if (!text || !canUseBrowserSpeech()) {
    state.audioError = 'browser speech unavailable';
    voiceStatus(state.audioError, '');
    return false;
  }
  await waitForBrowserVoices();
  return new Promise(resolve => {
    const utterance = new SpeechSynthesisUtterance(text);
    const voice = pickBrowserVoice();
    let settled = false;
    if (voice) utterance.voice = voice;
    utterance.pitch = 1.04;
    utterance.rate = 0.96;
    utterance.volume = 1;
    const finish = ok => {
      if (settled) return;
      settled = true;
      if (runId !== state.speechRun) {
        resolve(false);
        return;
      }
      state.speaking = false;
      state.voiceReady = true;
      state.voiceMode = 'browser';
      voiceStatus(ok ? `browser voice${voice ? `: ${voice.name}` : ''}` : 'browser voice blocked', ok ? 'on' : '');
      resolve(ok);
    };
    utterance.onstart = () => {
      if (runId !== state.speechRun) return;
      state.speaking = true;
      state.pulse = Math.max(state.pulse, 1);
      state.voiceMode = 'browser';
      voiceStatus(`browser voice${voice ? `: ${voice.name}` : ''}`, 'busy');
    };
    utterance.onend = () => finish(true);
    utterance.onerror = event => {
      state.audioError = event.error || 'browser speech failed';
      if (!retried) {
        setTimeout(() => {
          browserSpeak(text, true, runId).then(resolve);
        }, 400);
        return;
      }
      finish(false);
    };
    try {
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
      setTimeout(() => finish(true), Math.max(5000, text.length * 95));
    } catch (e) {
      state.audioError = e.message || String(e);
      finish(false);
    }
  });
}
function splitSentences(text) {
  const raw = String(text || '').match(/[^.!?…]+[.!?…]+["')\]]*\s*|[^.!?…]+$/g) || [text];
  const parts = [];
  for (let part of raw) {
    part = compact(part, 240);
    if (!part) continue;
    if (parts.length && (part.length < 18 || parts[parts.length - 1].length < 34)) {
      parts[parts.length - 1] = `${parts[parts.length - 1]} ${part}`;
    } else {
      parts.push(part);
    }
  }
  return parts.length ? parts.slice(0, 5) : [compact(text, 240)];
}
async function fetchVoiceUrl(text, runId) {
  if (runId !== state.speechRun) throw new Error('stale speech');
  const controller = new AbortController();
  state.voiceAbort = controller;
  const timeout = setTimeout(() => controller.abort(), TRAINED_VOICE_TIMEOUT_MS);
  const r = await fetch('/tts/synth', {
    method: 'POST',
    headers: { ...headers(true), Accept: 'audio/mpeg,audio/wav,audio/*' },
    body: JSON.stringify({ text: compact(text, 480) }),
    signal: controller.signal,
  }).finally(() => {
    clearTimeout(timeout);
    if (state.voiceAbort === controller) state.voiceAbort = null;
  });
  if (runId !== state.speechRun) throw new Error('stale speech');
  if (!r.ok) {
    state.lastTtsStatus = r.status;
    if (r.status === 403) {
      localStorage.removeItem('weaver_llm_key');
      state.key = '';
      throw new Error('voice key rejected - tap Wake and re-enter key');
    }
    throw new Error(`tts ${r.status}`);
  }
  const blob = await r.blob();
  if (runId !== state.speechRun) throw new Error('stale speech');
  if (!/^audio\//i.test(blob.type || '')) throw new Error(`tts returned ${blob.type || 'non-audio'}`);
  state.lastTtsStatus = r.status;
  state.lastTtsContentType = blob.type || r.headers.get('Content-Type') || '';
  return URL.createObjectURL(blob);
}
function playVoiceUrl(url, runId, options = {}) {
  const revokeOnFailure = options.revokeOnFailure !== false;
  return new Promise((resolve, reject) => {
    let done = false;
    const finish = (ok, error) => {
      if (done) return;
      done = true;
      if (ok || revokeOnFailure || runId !== state.speechRun) {
        URL.revokeObjectURL(url);
      }
      audio.onended = null;
      audio.onerror = null;
      if (state.playReject === reject) state.playReject = null;
      if (runId !== state.speechRun) {
        resolve();
        return;
      }
      if (ok) {
        state.audioError = '';
        state.lastVoiceError = '';
        state.lastPlaybackAt = performance.now();
        resolve();
      } else {
        reject(error || new Error('audio playback failed'));
      }
    };
    if (runId !== state.speechRun) {
      finish(true);
      return;
    }
    state.playReject = reject;
    audio.onended = () => finish(true);
    audio.onerror = () => finish(false);
    audio.src = url;
    audio.load();
    const p = audio.play();
    if (p) p.catch(error => finish(false, error));
  });
}
async function speak(text) {
  if (!text) return;
  state.speechRun += 1;
  const runId = state.speechRun;
  silenceCurrentSpeech();
  state.lastVoiceText = compact(text, 800);
  state.lastVoiceError = '';
  clearPendingVoice();
  if (!state.voiceReady) await unlockAudio();
  if (!state.audioUnlocked && !canUseBrowserSpeech()) {
    voiceStatus('tap Wake to unlock audio', '');
    return;
  }
  const parts = splitSentences(text);
  state.speaking = true;
  state.pulse = Math.max(state.pulse, 1);
  voiceStatus('voice starting', 'busy');
  let nextUrl = fetchVoiceUrl(parts[0], runId);
  for (let i = 0; i < parts.length; i++) {
    let url = '';
    try {
      url = await nextUrl;
      if (runId !== state.speechRun) {
        URL.revokeObjectURL(url);
        return;
      }
      nextUrl = (i + 1 < parts.length) ? fetchVoiceUrl(parts[i + 1], runId) : null;
      state.voiceMode = 'trained';
      voiceStatus(i === 0 ? 'speaking' : `speaking ${i + 1}/${parts.length}`, 'busy');
      await playVoiceUrl(url, runId, { revokeOnFailure: false });
      state.pulse = Math.max(state.pulse, 0.55);
    } catch (e) {
      if (runId !== state.speechRun || /stale speech/i.test(e.message || '')) return;
      state.speaking = false;
      state.audioError = e.message || String(e);
      state.lastVoiceError = state.audioError;
      if (url && /notallowed|gesture|play|interrupted|abort/i.test(state.audioError)) {
        setPendingVoice(url, parts.slice(i).join(' ') || text, e);
        return;
      }
      voiceStatus(
        /notallowed|gesture|play/i.test(state.audioError)
          ? 'audio element blocked, using browser voice'
          : 'voice provider unavailable, using browser',
        'busy'
      );
      const remaining = parts.slice(i).join(' ');
      const spoke = await browserSpeak(remaining || text, false, runId);
      if (!spoke) {
        state.pendingVoiceText = compact(remaining || text, 520);
        voiceStatus(
          /notallowed|gesture|play/i.test(state.audioError)
            ? 'tap Wake again to unlock audio'
            : state.audioError || 'voice unavailable',
          ''
        );
      }
      return;
    }
  }
  if (runId !== state.speechRun) return;
  state.speaking = false;
  state.voiceMode = 'trained';
  voiceStatus('voice ready', 'on');
}
async function chat(text) {
  ui.heard.textContent = compact(text, 260);
  ui.said.textContent = 'thinking';
  dot(ui.brainDot, 'busy');
  state.pulse = 0.85;
  try {
    const r = await brainFetch('/brain/v1/chat/completions', {
      method: 'POST',
      body: JSON.stringify({
        model: HEADLESS_MODEL,
        max_tokens: 260,
        messages: [
          {
            role: 'system',
            content: [
              'You are Weaver in headless mode: no 3D body, no GPU, a floating reactive presence.',
              'Use Amazon Nova Pro for this headless floating presence.',
              'Use your trained voice endpoint for speech output after the text response.',
              'Be direct and grounded. State limits clearly when the browser or backend cannot perform something.'
            ].join(' ')
          },
          { role: 'user', content: text }
        ]
      })
    });
    const reply = compact(r.choices?.[0]?.message?.content || '', 1200);
    ui.said.textContent = reply || '-';
    state.pulse = 1;
    speak(reply);
    pollState();
  } catch (e) {
    ui.said.textContent = e.message;
  } finally {
    dot(ui.brainDot, 'on');
  }
}
async function triggerDream() {
  dot(ui.dreamDot, 'busy');
  try {
    const r = await brainFetch('/brain/trigger/dream', {
      method: 'POST',
      body: JSON.stringify({ reason: 'operator-headless-button' })
    });
    ui.lastDream.textContent = compact(r.dream, 360);
    state.pulse = 1;
    dot(ui.dreamDot, 'on');
  } catch (e) {
    ui.lastDream.textContent = e.message;
    dot(ui.dreamDot, '');
  }
}
function startMic() {
  if (state.realtime.live || state.realtime.connecting) stopRealtimeVoice('live stopped');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    ui.heard.textContent = 'speech recognition unavailable in this browser';
    return;
  }
  const rec = new SpeechRecognition();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'en-US';
  rec.onresult = (event) => {
    const text = event.results?.[0]?.[0]?.transcript || '';
    if (text) chat(text);
  };
  rec.onerror = (event) => { ui.heard.textContent = event.error || 'mic error'; };
  rec.start();
}
ui.wake.addEventListener('click', async () => {
  key();
  const ok = await unlockAudio();
  state.wakeSpoken = true;
  if (await replayPendingVoice()) {
    checkModels();
    pollState();
    return;
  }
  voiceStatus('testing voice', 'busy');
  speak(state.lastVoiceText || "I'm here.");
  checkModels();
  pollState();
  if (!ok && !canUseBrowserSpeech()) {
    voiceStatus('audio blocked', '');
  }
});

ui.live.addEventListener('click', startRealtimeVoice);
