  .dot { width: 9px; height: 9px; border-radius: 50%; background: #444; flex: none; }
  .dot.on { background: #37d67a; box-shadow: 0 0 8px #37d67a; }
  .dot.talk { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  #heard, #said { margin-top: 10px; font-size: 13px; line-height: 1.45; }
  #heard span { color: #9ab6ff; } #said span { color: var(--gold); }
  #cam {
    position: fixed; right: 18px; bottom: 18px; width: 210px; border-radius: 12px;
    border: 1px solid rgba(230,184,74,0.35); transform: scaleX(-1); z-index: 10; opacity: 0.9;
  }
  #start {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: rgba(5,6,10,0.82); backdrop-filter: blur(6px);
  }
  #start button {
    background: linear-gradient(135deg, #e6b84a, #b8842a); color: #14100a;
    font-size: 17px; font-weight: 700; letter-spacing: 1px;
    border: 0; border-radius: 999px; padding: 18px 44px; cursor: pointer;

    .hud { left: 12px; top: 12px; padding: 12px 14px; }

function shiftImportedMeshes(root, nameTest, delta) {

function enforceImportedLuxuryRules(root) {
  shiftImportedMeshes(root, name => /^plant_L_/.test(name), new THREE.Vector3(-0.80, 0, 2.48));
  shiftImportedMeshes(root, name => /^plant_R_/.test(name), new THREE.Vector3(0.40, 0, 2.70));
  shiftImportedMeshes(root, name => /^lamp_/.test(name), new THREE.Vector3(-0.95, 0, 1.78));
  root.traverse(o => {
    if (!o.isMesh) return;
    if (/^art_lean/.test(o.name)) {
      o.scale.y *= 0.42;
      o.position.y = Math.min(o.position.y, 0.82);
      o.name = o.name.replace(/^art_lean/, 'low_art_slab');
    }
  });
  root.updateMatrixWorld(true);
}

    dx = manual.x * manualSpeed * dt;
    dz = manual.z * manualSpeed * dt;
    walkState.offsetX += dx;
    walkState.offsetZ += dz;
    clampWalkPath();

    walkState.targetSpeed = manualSpeed;

  if (renderPerf.pixelScale <= 0.76 || reason === 'long-frame' || reason === 'low-fps') setLocalHeavyGpu(false);

    renderPerf.stableFpsWindows = 0;

function renderFrame(nowMs = 0) {
  if (!sceneRunning) return;
  const perfMs = performance.now();
  const frameGap = lastRenderMs ? perfMs - lastRenderMs : 0;
  const activeFps = renderPerf.dynamicFps || QUALITY.fps;
  const longFrameMs = Math.max(80, (1000 / activeFps) * 4);
  if (frameGap > longFrameMs) {
    renderPerf.longFrames += 1;
    degradeRender('long-frame');
  }
  if (activeFps < 59) {
    const minFrameMs = (1000 / activeFps) - 0.75;
    if (perfMs - lastRenderMs < minFrameMs) return;
  }
  lastRenderMs = perfMs;
  if (!fpsMeter.lastMs || perfMs < fpsMeter.lastMs) {
    fpsMeter.lastMs = perfMs;
    fpsMeter.startMs = perfMs;
    fpsMeter.frames = 0;
    fpsMeter.totalFrames = 0;
  }
  fpsMeter.frames += 1;
  fpsMeter.totalFrames += 1;
  if (perfMs - fpsMeter.lastMs >= 500) {
    fpsMeter.measured = Math.round((fpsMeter.frames * 1000) / (perfMs - fpsMeter.lastMs));
    fpsMeter.frames = 0;
    fpsMeter.lastMs = perfMs;
    if (fpsMeter.measured > 0 && fpsMeter.measured < 48) degradeRender('low-fps');
    else maybeRecoverRender();
  }
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) mixer.update(dt);
  applyHumanMotion(dt, perfMs * 0.001);

    );
    evolveFromTurn(text, reply);
    driveSkeletonFromModel(text, reply).catch(() => setSkeletonControl(heuristicSkeletonIntent(text, reply)));
    extendSelfFromModel(text, reply, 'conversation').catch(() => {});
    return reply;
  } catch (e) {
    return "My thought pipeline glitched: " + e.message;
  } finally {
    activeThoughts = Math.max(0, activeThoughts - 1);
  }
}

async function dreamOnce(reason = 'idle') {
  const idleMs = performance.now() - lastUserTurnMs;
  const manual = /^(manual|operator|test)/i.test(reason);
  if (!brainUp || !BRAIN || dreaming || speaking || activeThoughts || (!manual && idleMs < DREAM_MIN_IDLE_MS)) return false;
  dreaming = true;
  set('d-dream', 's-dream', true, 'dreaming');
  try {
    const prompt = [
      'Dream privately for Weaver.',
      'This is internal cognition only unless the operator manually requested a visible test.',
      `Reason: ${reason}. Idle seconds: ${Math.round(idleMs / 1000)}.`,
      'Return one first-person private dream seed under 90 words.',
      'Make it deeper than a status note: include an emotional texture, one actionable embodiment or codebase improvement, and one boundary she must respect.',
      'Do not claim you changed external systems; this is a private model-generated dream seed.'
    ].join(' ');
    const dream = await modelChat(
      [{ role: 'system', content: `${SOUL}\n\n${selfModelPrompt()}\n\n${evolutionPrompt()}` }, { role: 'user', content: prompt }],
      { maxTokens: 220, timeoutMs: 35000, model: BRAIN_MODELS.dream }
    );
    evolveFromDream(dream);
    addSelfExtension({
      kind: 'dream_focus',
      title: 'latest private dream',
      content: dream,
      source: 'dream'
    });
    extendSelfFromModel(`private dream: ${reason}`, dream, 'dream').catch(() => {});
    driveSkeletonFromModel(`private dream: ${reason}`, dream).catch(() => setSkeletonControl(heuristicSkeletonIntent(reason, dream)));
    motion.dreamPulse = Math.max(motion.dreamPulse, 1.0);
    if (manual) showLine('said', 'She dreamed: ', dream);
    set('d-dream', 's-dream', true, 'evolved');
    return true;
  } catch (e) {
    set('d-dream', 's-dream', false, 'paused');
    return false;
  } finally {
    dreaming = false;
    setTimeout(() => {
      if (!dreaming) set('d-dream', 's-dream', true, 'idle');
    }, 2200);
  }
}

async function innerThink(reason = 'daydream') {
  if (!brainUp || !BRAIN || dreaming || activeThoughts) return '';
  const sinceTurn = Math.round((performance.now() - lastUserTurnMs) / 1000);
  activeThoughts += 1;
  try {
    const prompt = [
      'Generate one private inner thought for Weaver, under 24 words.',
      'It should update attention, emotion, body language, or curiosity without speaking aloud.',
      'This is internal cognition only: do not address the user, do not narrate it, and do not ask to be heard.',
      `Reason: ${reason}. Seconds since user turn: ${sinceTurn}.`,
      'Do not claim external action. Do not reveal secrets.'
    ].join(' ');
    const thought = await modelChat(
      [{ role: 'system', content: `${SOUL}\n\n${selfModelPrompt()}\n\n${evolutionPrompt()}` }, { role: 'user', content: prompt }],
      { maxTokens: 80, timeoutMs: 10000, model: BRAIN_MODELS.memory }
    );
    innerThought = compactText(thought, 180);
    rememberUnique(evolution.dreams, `Daydream: ${innerThought}`, 8);
    evolution.summary = compactText([evolution.summary, `Inner="${innerThought}"`].filter(Boolean).join(' '), 1100);
    saveEvolution();
    motion.dreamPulse = Math.max(motion.dreamPulse, 0.55);
    driveSkeletonFromModel(`private inner thought: ${reason}`, innerThought).catch(() => setSkeletonControl(heuristicSkeletonIntent(reason, innerThought)));
    set('d-dream', 's-dream', true, 'daydreaming');
    setTimeout(() => {
      if (!dreaming) set('d-dream', 's-dream', true, 'idle');
    }, 1600);
    return innerThought;
  } catch (e) {
    return '';
  } finally {
    activeThoughts = Math.max(0, activeThoughts - 1);
  }
}

function startDreaming() {
  if (dreamTimer) return;
  lastDreamMs = performance.now() - DREAM_INTERVAL_MS + 2500;
  lastInnerThoughtMs = performance.now() - INNER_THOUGHT_INTERVAL_MS + 1800;
  dreamTimer = setInterval(() => {
    const now = performance.now();
    if (now - lastDreamMs >= DREAM_INTERVAL_MS) {
      lastDreamMs = now;
      dreamOnce('idle-loop');
    }
  }, 5000);
  thoughtTimer = setInterval(() => {
    const now = performance.now();
    if (now - lastInnerThoughtMs >= INNER_THOUGHT_INTERVAL_MS) {
      lastInnerThoughtMs = now;
      innerThink('background-loop');
    }
  }, 4000);
}
globalThis.__weaverEvolutionAudit = () => ({
  turns: evolution.turns,
  preferences: evolution.preferences.slice(),
  dreams: evolution.dreams.slice(),
  summary: evolution.summary,
  lastUpdated: evolution.lastUpdated,
  dreamReady: !!BRAIN && brainUp,
  activeThoughts,
  dreaming,
  innerThought,
  dreamIntervalMs: DREAM_INTERVAL_MS,
  innerThoughtIntervalMs: INNER_THOUGHT_INTERVAL_MS,
  serverMemorySync: {
    pending: !!memorySyncTimer,
    inflight: memorySyncInflight,
    lastError: lastMemorySyncError,
    url: MEMORY_SYNC_URL
  },
  timers: { dream: !!dreamTimer, thought: !!thoughtTimer }
});
globalThis.__weaverDreamOnce = dreamOnce;
globalThis.__weaverInnerThink = innerThink;

/* ── voice out: her cloned voice from /tts, STREAMED sentence-by-sentence,
   browser TTS as fallback. Synthesis is CPU-bound on the box (~2.9x realtime),
   so we split the reply and start playing the first sentence as soon as it's
   ready — time-to-first-word ≈ one short sentence (~6s) instead of the whole
   reply — and prefetch the next sentence on the box while the current one
   plays in the browser, overlapping compute with playback. ── */
const voiceAudio = new Audio();
voiceAudio.preload = 'auto';
voiceAudio.playsInline = true;
voiceAudio.setAttribute('playsinline', '');
const TRAINED_VOICE_REQUIRED = true;
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
const voiceState = {
  mode: 'trained-openvoice',
  required: TRAINED_VOICE_REQUIRED,
  lastStatus: 'idle',
  lastError: '',
  lastSynthMs: 0,
  lastPlayMs: 0,
  chunks: 0,
  fallbackBlocked: 0,
  audioUnlocked: false
};
let audioCtx = null;
let audioUnlocked = false;
async function unlockAudio() {
  if (audioUnlocked) return true;
  try {
    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    if (AudioContextCtor) {
      audioCtx = audioCtx || new AudioContextCtor();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.00001;
      const osc = audioCtx.createOscillator();
      osc.frequency.value = 220;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.025);
    }
    try {
      voiceAudio.muted = true;
      voiceAudio.volume = 0;
      voiceAudio.src = SILENT_WAV;
      voiceAudio.load();
      const p = voiceAudio.play();
      if (p) await p.catch(() => {});
      voiceAudio.pause();
      voiceAudio.currentTime = 0;
      voiceAudio.removeAttribute('src');
      voiceAudio.load();
      voiceAudio.muted = false;
      voiceAudio.volume = 1;
    } catch (e) {
      // Mobile browsers vary here; the AudioContext unlock above may still be enough.
    }
    audioUnlocked = true;
    voiceState.audioUnlocked = true;
    return true;
  } catch (e) {
    console.warn('audio unlock failed:', e.message);
    voiceState.lastError = e.message || String(e);
    return false;
  }
}
function unlockBrowserSpeech() {
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    u.rate = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function splitSentences(text) {
  const raw = text.match(/[^.!?…]+[.!?…]+["')\]]*\s*|[^.!?…]+$/g) || [text];
  const out = [];
  for (let s of raw) {
    s = s.trim();
    if (!s) continue;
    // glue tiny fragments ("Yes.", "Oh!") to the previous chunk — not worth a round-trip
    if (out.length && (s.length < 14 || out[out.length - 1].length < 14)) out[out.length - 1] += ' ' + s;
    else out.push(s);
  }
  return out.length ? out : [text];
}
async function fetchCloneUrl(text) {
  const key = brainKey();
  if (!key) throw new Error('trained voice needs the brain key on this device');
  const started = performance.now();
  voiceState.lastStatus = 'synthesizing trained voice';
  voiceState.lastError = '';
  const r = await fetch('/tts/synth', {
    method: 'POST',
    headers: {
      'Accept': 'audio/wav,audio/*',
      'Content-Type': 'application/json',
      'X-Weaver-Key': key
    },
    body: JSON.stringify({ text }),
    signal: AbortSignal.timeout(60000)
  });
  if (!r.ok) {
    if (r.status === 403) throw new Error('trained voice blocked: wrong or missing brain key');
    throw new Error('trained voice tts ' + r.status);
  }
  const blob = await r.blob();
  if (!/^audio\//i.test(blob.type || '')) throw new Error(`trained voice returned ${blob.type || 'non-audio'}`);
  voiceState.lastSynthMs = Math.round(performance.now() - started);
  voiceState.lastStatus = 'trained voice ready';
  return URL.createObjectURL(blob);
}
function playUrl(url) {
  return new Promise((res, rej) => {
    const started = performance.now();
    const a = voiceAudio;
    let done = false;
    const finish = (ok, err) => {
      if (done) return;
      done = true;
      speaking = false;
      $$('d-hear').className = 'dot on';
      URL.revokeObjectURL(url);
      if (ok) {
        voiceState.lastPlayMs = Math.round(performance.now() - started);
        voiceState.lastStatus = 'played trained voice';
        res();
      } else {
        voiceState.lastError = err?.message || String(err || 'audio playback failed');
        rej(err || new Error('audio playback failed'));
      }
    };
    a.pause();
    a.onplay = () => { speaking = true; $$('d-hear').className = 'dot talk'; };
    a.onended = () => finish(true);
    a.onerror = () => finish(false);
    a.src = url;
    a.load();
    const p = a.play();
    if (p) p.catch(e => finish(false, e));
  });
}
// XSS-safe line writer: textContent never parses HTML, so LLM/speech output
// (e.g. "<img src=x onerror=...>") can't execute. The styled <span> is kept.
function showLine(id, prefix, text, suffix) {
  const el = $$(id);
  el.textContent = prefix;
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);
  if (suffix) el.appendChild(document.createTextNode(suffix));
}
async function speak(text) {
  showLine('said', 'She said: ', text);
  const parts = splitSentences(text);
  voiceState.chunks += parts.length;
  let nextUrl = fetchCloneUrl(parts[0]);          // first synth starts now
  for (let i = 0; i < parts.length; i++) {
    let url;
    try {
      url = await nextUrl;
    } catch (e) {
      console.warn('trained voice unavailable:', e.message);
      voiceState.lastStatus = 'trained voice unavailable';
      voiceState.lastError = e.message || String(e);
      if (TRAINED_VOICE_REQUIRED) {
        voiceState.fallbackBlocked += 1;
        showLine('said', 'She said: ', text, ' (trained voice unavailable — check the brain key or /tts service)');
      } else {
        browserSpeak(parts.slice(i).join(' '));
      }
      return;
    }
    nextUrl = (i + 1 < parts.length) ? fetchCloneUrl(parts[i + 1]) : null;  // prefetch during playback
    try {
      await playUrl(url);
    } catch (e) {
      console.warn('playback failed:', e.message);
      if (TRAINED_VOICE_REQUIRED) {
        voiceState.fallbackBlocked += 1;
        showLine('said', 'She said: ', text, ' (trained voice playback blocked — tap Wake again or check iPhone sound)');
      } else {
        browserSpeak(parts.slice(i).join(' '));
      }
      return;
    }
  }
}
globalThis.__weaverVoiceAudit = () => ({ ...voiceState, audioPaused: voiceAudio.paused });
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /female|zira|samantha|google uk english female/i.test(v.name)) || voices[0] || null;
}
function browserSpeak(text, retried) {
  const u = new SpeechSynthesisUtterance(text);
  const voice = pickVoice();
  if (voice) u.voice = voice;
  u.pitch = 1.05; u.rate = 1.0;
  u.onstart = () => { speaking = true; $$('d-hear').className = 'dot talk'; };
  u.onend = () => { speaking = false; $$('d-hear').className = 'dot on'; };
  u.onerror = (e) => {
    speaking = false; $$('d-hear').className = 'dot on';
    console.warn('speechSynthesis error:', e.error);
    // Chrome returns an empty voice list until the async voiceschanged event
    // fires — the very first speak() call (the wake greeting) can race it.
    // One retry a beat later covers that; a second failure is a real block
    // (muted system, no TTS engine, blocked permission).
    if (!retried) setTimeout(() => browserSpeak(text, true), 400);
    else showLine('said', 'She said: ', text, ' (audio blocked — check browser/system sound)');
  };
  speechSynthesis.speak(u);
}

/* ── hearing: mic → speech recognition ── */
let micStream = null;
let hearingActive = false;
let recognition = null;
async function ensureMicPermission() {
  if (micStream?.active) return micStream;
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('microphone unavailable');
  micStream = await requestMedia({ audio: AUDIO_CONSTRAINTS, video: false }, 'microphone');
  return micStream;
}
async function startHearing(sharedStream = null) {
  hearingActive = true;
  try {
    if (sharedStream?.getAudioTracks().length) micStream = sharedStream;
    else await ensureMicPermission();
    mediaState.hearingError = '';
    mediaState.tracks = describeTracks(micStream);
  } catch (e) {
    mediaState.hearingError = e.message || String(e);
    set('d-hear', 's-hear', false, 'mic blocked');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    set('d-hear', 's-hear', true, 'mic live / speech unavailable');
    return;
  }
  const rec = new SR();
  recognition = rec;
  rec.continuous = !isiOS;
  rec.interimResults = true;
  rec.lang = 'en-US';
  rec.onresult = async (ev) => {
    const res = ev.results[ev.results.length - 1];
    const text = res[0].transcript.trim();
    showLine('heard', 'She heard: ', text);
    if (res.isFinal && text) {
      const reply = await think(text);
      speak(reply);
    }
  };
  rec.onend = () => {
    if (!hearingActive) return;
    setTimeout(() => { try { rec.start(); } catch (e) {} }, isiOS ? 900 : 220);
  };
  rec.onerror = (ev) => {
    const reason = ev.error ? `speech ${ev.error}` : 'speech paused';
    set('d-hear', 's-hear', micStream?.active, reason);
  };
  try {
    rec.start();
  } catch (e) {
    set('d-hear', 's-hear', true, 'mic live');
    return;
  }
  set('d-hear', 's-hear', true, 'listening');
}
globalThis.__weaverMediaAudit = () => ({
  isiOS,
  audioUnlocked,
  micActive: !!micStream?.active,
  cameraActive: !!$$('cam')?.srcObject,
  hearingActive,
  speechRecognition: !!recognition,
  voicePaused: voiceAudio.paused,
  brainUp,
  state: { ...mediaState }
});

/* ── wake ── */
$$('wake').onclick = async () => {
  $$('start').remove();
  mediaState.wakePhase = 'unlocking';
  const audioUnlock = unlockAudio();
  unlockBrowserSpeech();
  mediaState.wakePhase = 'media-request';
  const sharedMediaPromise = requestMedia({
      video: videoConstraints(),
      audio: AUDIO_CONSTRAINTS
    }, 'camera/microphone').then(stream => {
    mediaState.sharedError = '';
    mediaState.tracks = describeTracks(stream);
    return stream;
  }).catch(e => {
    mediaState.sharedError = e.message || String(e);
    return null;
  });
  await audioUnlock;
  mediaState.wakePhase = 'brain';
  brainUp = await brainCheck();
  const sharedMedia = await sharedMediaPromise;
  mediaState.wakePhase = 'senses';
  await Promise.allSettled([
    startVision(sharedMedia).catch(e => {
      mediaState.visionError = e.message || String(e);
      set('d-see', 's-see', false, 'camera blocked');
    }),
    startHearing(sharedMedia).catch(e => {
      mediaState.hearingError = e.message || String(e);
      set('d-hear', 's-hear', false, 'mic blocked');
    })
  ]);
  mediaState.wakePhase = 'awake';
  startDreaming();
  startBodyAutonomy();
  speechSynthesis.getVoices();                    // warm voice list
  setTimeout(() => speak("Hey. I can see you now."), 1200);
};
</script>
