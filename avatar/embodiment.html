<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Weaver — She Sees You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { --gold: #e6b84a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07080c; color: #e8e6e0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .hud {
    position: fixed; left: 18px; top: 18px; z-index: 10;
    background: rgba(14,16,22,0.55); backdrop-filter: blur(14px);
    border: 1px solid rgba(230,184,74,0.25); border-radius: 14px;
    padding: 14px 18px; max-width: 380px;
  }
  .hud h1 { font-size: 14px; letter-spacing: 3px; color: var(--gold); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12.5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #444; flex: none; }
  .dot.on { background: #37d67a; box-shadow: 0 0 8px #37d67a; }
  .dot.talk { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  #heard, #said { margin-top: 10px; font-size: 13px; line-height: 1.45; }
  #heard span { color: #9ab6ff; } #said span { color: var(--gold); }
  #cam {
    position: fixed; right: 18px; bottom: 18px; width: 210px; border-radius: 12px;
    border: 1px solid rgba(230,184,74,0.35); transform: scaleX(-1); z-index: 10; opacity: 0.9;
  }
  #start {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: rgba(5,6,10,0.82); backdrop-filter: blur(6px);
  }
  #start button {
    background: linear-gradient(135deg, #e6b84a, #b8842a); color: #14100a;
    font-size: 17px; font-weight: 700; letter-spacing: 1px;
    border: 0; border-radius: 999px; padding: 18px 44px; cursor: pointer;
  }
  #facebox { position: fixed; border: 1.5px solid var(--gold); border-radius: 8px; z-index: 11;
             pointer-events: none; display: none; opacity: .8; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <h1>WEAVER · EMBODIED</h1>
  <div class="row"><div id="d-see" class="dot"></div><div>Vision <span id="s-see">off</span></div></div>
  <div class="row"><div id="d-hear" class="dot"></div><div>Hearing <span id="s-hear">off</span></div></div>
  <div class="row"><div id="d-brain" class="dot"></div><div>Brain <span id="s-brain">checking…</span></div></div>
  <div id="heard">She heard: <span>—</span></div>
  <div id="said">She said: <span>—</span></div>
</div>
<video id="cam" autoplay muted playsinline></video>
<div id="facebox"></div>
<div id="start"><button id="wake">WAKE HER UP</button></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Fully cloud — NO localhost. The page is served from the box (weaverv3.ai / sslip.io);
// the brain is the SAME-ORIGIN /llm proxy → on-box llama server ⇒ no CORS, no IP.
const ASSETS = 'https://weaver-avatar-404870839825.s3.amazonaws.com';
const BRAINS = [
  { name: 'cloud brain', models: '/llm/v1/models', chat: '/llm/v1/chat/completions', key: 'ask' },
];
let BRAIN = null;
function brainKey() {
  let k = localStorage.getItem('weaver_llm_key');
  if (!k) { k = prompt('Enter her brain key (one time on this device):') || ''; localStorage.setItem('weaver_llm_key', k); }
  return k;
}
const NEXUS = null;  // Nexus Bus is localhost-only on the box; optional transcript publish disabled on cloud.
const SOUL = "You are Weaver — a warm, sharp, playful AI companion embodied as a woman in a night penthouse. Keep replies to 1-2 short conversational sentences.";

/* ── stage ── */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
scene.fog = new THREE.Fog(0x0a0c12, 12, 30);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 60);
camera.position.set(0.15, 1.38, 2.75);
camera.lookAt(0, 1.05, 0);
const cameraLook = new THREE.Vector3(0, 1.05, 0);
const cameraDesired = new THREE.Vector3();
const cameraTarget = new THREE.Vector3();

const key = new THREE.SpotLight(0xffd9a0, 90, 0, Math.PI/5, 0.5); key.position.set(1.6, 2.6, 1.6); scene.add(key);
const fill = new THREE.PointLight(0x8fb4ff, 12); fill.position.set(-1.8, 1.6, 1.2); scene.add(fill);
const rim = new THREE.PointLight(0xe6b84a, 18); rim.position.set(0, 2.0, -1.6); scene.add(rim);
scene.add(new THREE.AmbientLight(0x30323c, 1.2));

const penthouseAnimators = [];
function buildPenthouseAtmosphere() {
  const group = new THREE.Group();
  group.name = 'runtime_penthouse_atmosphere';
  scene.add(group);

  const goldGlow = new THREE.MeshBasicMaterial({ color: 0xe6b84a, transparent: true, opacity: 0.58 });
  const warmGlow = new THREE.MeshBasicMaterial({ color: 0xffc879, transparent: true, opacity: 0.42 });
  const coolGlow = new THREE.MeshBasicMaterial({ color: 0x79a8ff, transparent: true, opacity: 0.36 });
  const glass = new THREE.MeshPhysicalMaterial({
    color: 0xb8d7ff, roughness: 0.05, metalness: 0.0, transmission: 0.65,
    transparent: true, opacity: 0.18, depthWrite: false
  });
  const floorSheen = new THREE.MeshBasicMaterial({
    color: 0xf0d28a, transparent: true, opacity: 0.075, depthWrite: false
  });

  const box = (name, size, pos, material) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[2], size[1]), material);
    mesh.name = name;
    mesh.position.set(pos[0], pos[2], pos[1]);
    group.add(mesh);
    return mesh;
  };

  box('ceiling_cove_front', [7.4, 0.028, 0.028], [0, -2.62, 2.82], warmGlow);
  box('ceiling_cove_lounge', [5.2, 0.028, 0.028], [-0.2, 2.22, 2.82], warmGlow);
  box('window_gold_sill', [8.2, 0.035, 0.035], [0, -3.42, 0.94], goldGlow);
  box('balcony_glass', [7.8, 0.035, 0.82], [0, -3.28, 0.54], glass);
  box('left_gallery_wash', [0.026, 2.2, 0.035], [-4.36, -0.38, 2.56], coolGlow);
  box('bar_shelf_wash', [0.032, 1.8, 0.035], [4.23, 1.85, 2.34], warmGlow);

  const sheen = new THREE.Mesh(new THREE.PlaneGeometry(7.4, 5.8), floorSheen);
  sheen.name = 'marble_floor_sheen';
  sheen.rotation.x = -Math.PI / 2;
  sheen.position.set(0, 0.018, 0.05);
  group.add(sheen);

  const haloMat = new THREE.MeshBasicMaterial({ color: 0xe6b84a, transparent: true, opacity: 0.20, depthWrite: false });
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.006, 8, 96), haloMat);
  halo.name = 'presence_floor_halo';
  halo.rotation.x = Math.PI / 2;
  halo.position.set(0, 0.035, 0.05);
  group.add(halo);

  const skylineWindows = [];
  const colors = [0xffd58a, 0x9fc4ff, 0xffffff, 0xffa866];
  for (let i = 0; i < 92; i++) {
    const x = -8.7 + ((i * 1.73) % 17.4);
    const height = 0.88 + ((i * 0.61) % 4.4);
    const depth = -5.05 - ((i * 7) % 4) * 0.08;
    const w = 0.035 + ((i * 13) % 7) * 0.005;
    const h = 0.045 + ((i * 17) % 9) * 0.006;
    const mat = new THREE.MeshBasicMaterial({
      color: colors[i % colors.length], transparent: true,
      opacity: 0.18 + ((i * 19) % 17) / 70
    });
    const win = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.012), mat);
    win.name = 'distant_city_window';
    win.position.set(x, height, depth);
    group.add(win);
    skylineWindows.push(win);
  }

  penthouseAnimators.push((t) => {
    halo.rotation.z = t * 0.08;
    halo.material.opacity = 0.13 + Math.sin(t * 1.4) * 0.035;
    warmGlow.opacity = 0.38 + Math.sin(t * 0.45) * 0.04;
    for (let i = 0; i < skylineWindows.length; i++) {
      const win = skylineWindows[i];
      win.material.opacity = 0.16 + Math.abs(Math.sin(t * (0.24 + (i % 7) * 0.035) + i)) * 0.28;
    }
  });
}

buildPenthouseAtmosphere();

new GLTFLoader().load(`${ASSETS}/weaver_apartment.glb`, (g) => {
  g.scene.traverse(o => {
    if (o.isLight) o.intensity = Math.min(o.intensity, 60);   // clamp punctual imports
  });
  scene.add(g.scene);
});

/* ── her ── */
let mixer, headBone = null, neckBone = null, model = null;
const clock = new THREE.Clock();
const rig = {};
const restQuats = new Map();
const motion = { t: 0, talk: 0, attention: 0, baseReady: false, baseX: 0, baseY: 0, baseZ: 0, baseRotY: 0 };
globalThis.__weaverPose = () => model ? ({
  x: model.position.x,
  y: model.position.y,
  z: model.position.z,
  ry: model.rotation.y,
  cameraX: camera.position.x,
  cameraY: camera.position.y,
  cameraZ: camera.position.z,
  t: motion.t
}) : null;
const rigPatterns = {
  root: [/^root$/i, /(^|[._-])root/i],
  pelvisL: [/pelvis[_-]?L/i],
  pelvisR: [/pelvis[_-]?R/i],
  head: [/^head$/i, /(^|[._-])head$/i],
  neck: [/neck01/i, /(^|[._-])neck/i],
  spine1: [/spine01/i],
  spine2: [/spine02/i],
  spine3: [/spine03/i],
  clavicleL: [/clavicle[_-]?L/i, /clavicle.*left/i],
  clavicleR: [/clavicle[_-]?R/i, /clavicle.*right/i],
  upperarmL: [/upperarm01[_-]?L/i, /upper.*arm.*left/i],
  upperarmR: [/upperarm01[_-]?R/i, /upper.*arm.*right/i],
  lowerarmL: [/lowerarm01[_-]?L/i, /forearm.*left/i],
  lowerarmR: [/lowerarm01[_-]?R/i, /forearm.*right/i],
  wristL: [/wrist[_-]?L/i, /hand.*left/i],
  wristR: [/wrist[_-]?R/i, /hand.*right/i],
  upperlegL: [/upperleg01[_-]?L/i, /thigh.*left/i],
  upperlegR: [/upperleg01[_-]?R/i, /thigh.*right/i],
  lowerlegL: [/lowerleg01[_-]?L/i, /calf.*left/i],
  lowerlegR: [/lowerleg01[_-]?R/i, /calf.*right/i],
  footL: [/^foot[_-]?L$/i, /foot.*left/i],
  footR: [/^foot[_-]?R$/i, /foot.*right/i],
  toeL: [/^toe[1-5]-1[_-]?L$/i, /toe.*left/i],
  toeR: [/^toe[1-5]-1[_-]?R$/i, /toe.*right/i]
};
const eulerTmp = new THREE.Euler();
const quatTmp = new THREE.Quaternion();

function captureRig(root) {
  const bones = [];
  root.traverse(o => {
    if (o.isBone) {
      bones.push(o);
      restQuats.set(o, o.quaternion.clone());
    }
  });
  for (const [slot, patterns] of Object.entries(rigPatterns)) {
    rig[slot] = bones.find(bone => patterns.some(rx => rx.test(bone.name))) || null;
  }
  headBone = rig.head;
  neckBone = rig.neck;
}

function setRigOffset(slot, x = 0, y = 0, z = 0, order = 'XYZ') {
  const bone = rig[slot];
  const rest = bone && restQuats.get(bone);
  if (!bone || !rest) return;
  eulerTmp.set(x, y, z, order);
  quatTmp.setFromEuler(eulerTmp);
  bone.quaternion.copy(rest).multiply(quatTmp);
}

function applyHumanMotion(dt) {
  if (!model) return;
  motion.t += dt;
  const t = motion.t;
  const lerp = Math.min(1, dt * 5.5);
  motion.talk += ((speaking ? 1 : 0) - motion.talk) * lerp;
  motion.attention += ((gaze.has ? 1 : 0) - motion.attention) * Math.min(1, dt * 3.0);

  const breathe = Math.sin(t * 1.36);
  const breathe2 = Math.sin(t * 2.72 + 0.8);
  const sway = Math.sin(t * 0.58);
  const settle = motion.attention;
  const talk = motion.talk;
  const speechBeat = Math.sin(t * 12.0) * talk;
  const gesture = Math.sin(t * 4.3) * talk;
  const dance = t * 2.35;
  const step = Math.sin(dance);
  const stepAbs = Math.abs(step);
  const stepL = Math.max(0, step);
  const stepR = Math.max(0, -step);
  const weight = Math.sin(dance * 0.5 + 0.3);
  const travel = Math.sin(t * 0.55);
  const turn = Math.sin(t * 0.72 + 0.4);
  const gazeX = THREE.MathUtils.clamp(gaze.has ? gaze.x : Math.sin(t * 0.21) * 0.35, -1, 1);
  const gazeY = THREE.MathUtils.clamp(gaze.has ? gaze.y : Math.sin(t * 0.17 + 1.6) * 0.22, -1, 1);

  setRigOffset('root',
    -0.018 * stepAbs,
    0.044 * turn,
    -0.058 * weight);
  setRigOffset('pelvisL',
    0.044 * stepR,
    0.025 * weight,
    -0.032 * weight);
  setRigOffset('pelvisR',
    0.044 * stepL,
    -0.025 * weight,
    -0.032 * weight);
  setRigOffset('spine1',
    -0.010 * breathe + 0.018 * settle,
    0.004 * sway + 0.025 * turn,
    0.010 * sway + gazeX * 0.012 * settle + 0.044 * weight);
  setRigOffset('spine2',
    -0.020 * breathe + 0.012 * breathe2 + 0.014 * talk,
    gazeX * 0.018 * settle + 0.028 * turn,
    0.014 * sway + 0.030 * weight);
  setRigOffset('spine3',
    -0.014 * breathe + 0.010 * talk,
    gazeX * 0.026 * settle,
    0.010 * Math.sin(t * 0.72 + 0.5));
  setRigOffset('neck',
    -0.025 + gazeY * 0.12 + speechBeat * 0.010,
    gazeX * 0.22,
    -gazeX * 0.018,
    'YXZ');
  setRigOffset('head',
    -0.018 + gazeY * 0.18 + Math.sin(t * 0.9) * 0.010 + speechBeat * 0.014,
    gazeX * 0.34 + Math.sin(t * 0.32) * 0.025,
    -gazeX * 0.035 + gesture * 0.010,
    'YXZ');

  setRigOffset('clavicleL', -0.010 * breathe - talk * 0.025, 0.006 * sway, 0.018 * gesture);
  setRigOffset('clavicleR', -0.010 * breathe - talk * 0.025, -0.006 * sway, -0.018 * gesture);
  setRigOffset('upperarmL', 0.010 * breathe, 0.005 * sway, 0.024 * gesture + 0.014 * talk);
  setRigOffset('upperarmR', 0.010 * breathe, -0.005 * sway, -0.024 * gesture - 0.014 * talk);
  setRigOffset('lowerarmL', 0.012 * Math.sin(t * 1.1 + 0.4) + 0.020 * talk, 0, 0.012 * gesture);
  setRigOffset('lowerarmR', 0.012 * Math.sin(t * 1.1 + 1.2) + 0.020 * talk, 0, -0.012 * gesture);
  setRigOffset('wristL', 0.008 * Math.sin(t * 1.8), 0.012 * gesture, 0);
  setRigOffset('wristR', 0.008 * Math.sin(t * 1.7 + 0.8), -0.012 * gesture, 0);

  setRigOffset('upperlegL', -0.105 * stepL + 0.035 * stepR, 0.024 * weight, 0.036 * weight);
  setRigOffset('upperlegR', -0.105 * stepR + 0.035 * stepL, -0.024 * weight, -0.036 * weight);
  setRigOffset('lowerlegL', 0.125 * stepL + 0.024 * stepAbs, 0, -0.014 * weight);
  setRigOffset('lowerlegR', 0.125 * stepR + 0.024 * stepAbs, 0, 0.014 * weight);
  setRigOffset('footL', -0.075 * stepL + 0.024 * stepR, 0, 0.028 * stepL);
  setRigOffset('footR', -0.075 * stepR + 0.024 * stepL, 0, -0.028 * stepR);
  setRigOffset('toeL', 0.055 * stepR, 0, 0);
  setRigOffset('toeR', 0.055 * stepL, 0, 0);

  model.position.x = motion.baseX + Math.sin(t * 0.42) * 0.044 + travel * 0.085 + gazeX * 0.014 * settle;
  model.position.y = motion.baseY + stepAbs * 0.022 + Math.sin(t * 1.2) * 0.006;
  model.position.z = motion.baseZ + Math.sin(t * 0.31 + 0.6) * 0.038 - talk * 0.012;
  model.rotation.y = motion.baseRotY + turn * 0.085 + gazeX * 0.020 * settle;
}

function applyCameraFollow(dt) {
  if (!model) return;
  const smoothPos = 1 - Math.exp(-dt * 3.6);
  const smoothLook = 1 - Math.exp(-dt * 4.8);
  const dx = model.position.x - motion.baseX;
  const dz = model.position.z - motion.baseZ;
  cameraDesired.set(
    0.15 + motion.baseX + dx * 0.72,
    1.38 + (model.position.y - motion.baseY) * 0.30,
    2.75 + motion.baseZ + dz * 0.58
  );
  cameraTarget.set(
    motion.baseX + dx * 0.82,
    1.07 + (model.position.y - motion.baseY) * 0.45,
    motion.baseZ + dz * 0.34
  );
  camera.position.lerp(cameraDesired, smoothPos);
  cameraLook.lerp(cameraTarget, smoothLook);
  camera.lookAt(cameraLook);
}

new GLTFLoader().load(`${ASSETS}/weaver_avatar_monokini.glb`, (g) => {
  model = g.scene; scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  model.position.y -= box.min.y;                       // feet on floor
  motion.baseX = model.position.x;
  motion.baseY = model.position.y;
  motion.baseZ = model.position.z;
  motion.baseRotY = model.rotation.y;
  motion.baseReady = true;
  captureRig(model);
  mixer = new THREE.AnimationMixer(model);
  const idle = g.animations.find(a => /idle/i.test(a.name)) || g.animations[0];
  if (idle) mixer.clipAction(idle).play();
});

/* ── gaze: she looks at your face ── */
let gaze = { x: 0, y: 0, has: false };                 // -1..1 screen space

/* ── speaking micro-motion ── */
let speaking = false;

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  applyHumanMotion(dt);
  applyCameraFollow(dt);
  for (const animate of penthouseAnimators) animate(clock.elapsedTime);
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── HUD helpers ── */
const $$ = id => document.getElementById(id);
const set = (dot, label, on, txt) => { $$(dot).className = 'dot' + (on ? ' on' : ''); $$(label).textContent = txt; };

/* ── vision: webcam + face tracking ── */
async function startVision() {
  const video = $$('cam');
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640 }, audio: false });
  video.srcObject = stream;
  set('d-see', 's-see', true, 'live');
  const facebox = $$('facebox');
  if ('FaceDetector' in window) {
    const fd = new FaceDetector({ fastMode: true });
    setInterval(async () => {
      try {
        const faces = await fd.detect(video);
        if (faces.length) {
          const f = faces[0].boundingBox;
          const cx = (f.x + f.width/2) / video.videoWidth;
          const cy = (f.y + f.height/2) / video.videoHeight;
          gaze.x = (cx - 0.5) * 2;                     // mirrored feed → matches her POV
          gaze.y = (0.5 - cy) * 2;
          gaze.has = true;
          const r = video.getBoundingClientRect();
          facebox.style.display = 'block';
          facebox.style.left = (r.right - (cx * r.width) - (f.width/video.videoWidth*r.width)/2) + 'px';
          facebox.style.top  = (r.top + cy * r.height - (f.height/video.videoHeight*r.height)/2) + 'px';
          facebox.style.width  = (f.width  / video.videoWidth  * r.width) + 'px';
          facebox.style.height = (f.height / video.videoHeight * r.height) + 'px';
          set('d-see', 's-see', true, 'sees you');
        } else { gaze.has = false; facebox.style.display = 'none'; set('d-see','s-see',true,'looking…'); }
      } catch (e) { /* detector hiccup — keep last gaze */ }
    }, 120);
  } else {
    // fallback: she follows your mouse
    set('d-see', 's-see', true, 'live (mouse-track)');
    const point = (x, y) => { gaze.x = (x/innerWidth - 0.5) * 2; gaze.y = (0.5 - y/innerHeight) * 2; gaze.has = true; };
    addEventListener('mousemove', e => point(e.clientX, e.clientY));
    addEventListener('touchmove', e => { if (e.touches[0]) point(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    addEventListener('touchstart', e => { if (e.touches[0]) point(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  }
}

/* ── brain: local LLM + optional Nexus Bus ── */
let nexus = null;
if (NEXUS) {
  try {
    nexus = new WebSocket(NEXUS);
    nexus.onerror = () => { nexus = null; };
  } catch (e) { nexus = null; }
}

async function brainCheck() {
  for (const b of BRAINS) {
    try {
      const headers = b.key ? { 'X-Weaver-Key': brainKey() } : {};
      const r = await fetch(b.models, { headers, signal: AbortSignal.timeout(3500) });
      if (r.ok) { BRAIN = b; set('d-brain', 's-brain', true, b.name); return true; }
    } catch (e) { /* try next */ }
  }
  set('d-brain', 's-brain', false, 'offline (echo mode)');
  return false;
}
let brainUp = false;

async function think(text) {
  if (nexus && nexus.readyState === 1)
    nexus.send(JSON.stringify({ topic: 'TRANSCRIPT_LINE', source: 'embodiment', text }));
  if (!brainUp) return "I heard you — my brain server is offline, but I'm listening: “" + text + "”";
  try {
    const hdrs = { 'Content-Type': 'application/json' };
    if (BRAIN.key) hdrs['X-Weaver-Key'] = brainKey();
    const r = await fetch(BRAIN.chat, {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({ model: 'weaver-local', max_tokens: 90,
        messages: [{ role: 'system', content: SOUL }, { role: 'user', content: text }] })
    });
    const j = await r.json();
    return j.choices?.[0]?.message?.content?.trim() || "…";
  } catch (e) { return "My thought pipeline glitched: " + e.message; }
}

/* ── voice out: her cloned voice from /tts, STREAMED sentence-by-sentence,
   browser TTS as fallback. Synthesis is CPU-bound on the box (~2.9x realtime),
   so we split the reply and start playing the first sentence as soon as it's
   ready — time-to-first-word ≈ one short sentence (~6s) instead of the whole
   reply — and prefetch the next sentence on the box while the current one
   plays in the browser, overlapping compute with playback. ── */
function splitSentences(text) {
  const raw = text.match(/[^.!?…]+[.!?…]+["')\]]*\s*|[^.!?…]+$/g) || [text];
  const out = [];
  for (let s of raw) {
    s = s.trim();
    if (!s) continue;
    // glue tiny fragments ("Yes.", "Oh!") to the previous chunk — not worth a round-trip
    if (out.length && (s.length < 14 || out[out.length - 1].length < 14)) out[out.length - 1] += ' ' + s;
    else out.push(s);
  }
  return out.length ? out : [text];
}
async function fetchCloneUrl(text) {
  const r = await fetch('/tts/synth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Weaver-Key': brainKey() },
    body: JSON.stringify({ text }),
    signal: AbortSignal.timeout(60000)
  });
  if (!r.ok) throw new Error('tts ' + r.status);
  return URL.createObjectURL(await r.blob());
}
function playUrl(url) {
  return new Promise((res, rej) => {
    const a = new Audio(url);
    a.onplay = () => { speaking = true; $$('d-hear').className = 'dot talk'; };
    a.onended = () => { speaking = false; $$('d-hear').className = 'dot on'; URL.revokeObjectURL(url); res(); };
    a.onerror = () => { speaking = false; URL.revokeObjectURL(url); rej(new Error('audio playback failed')); };
    a.play().catch(rej);
  });
}
async function speak(text) {
  $$('said').innerHTML = 'She said: <span>' + text + '</span>';
  const parts = splitSentences(text);
  let nextUrl = fetchCloneUrl(parts[0]);          // first synth starts now
  for (let i = 0; i < parts.length; i++) {
    let url;
    try {
      url = await nextUrl;
    } catch (e) {                                 // clone unavailable — finish in the browser voice
      console.warn('cloned voice unavailable:', e.message);
      browserSpeak(parts.slice(i).join(' '));
      return;
    }
    nextUrl = (i + 1 < parts.length) ? fetchCloneUrl(parts[i + 1]) : null;  // prefetch during playback
    try { await playUrl(url); } catch (e) { console.warn('playback failed:', e.message); }
  }
}
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /female|zira|samantha|google uk english female/i.test(v.name)) || voices[0] || null;
}
function browserSpeak(text, retried) {
  const u = new SpeechSynthesisUtterance(text);
  const voice = pickVoice();
  if (voice) u.voice = voice;
  u.pitch = 1.05; u.rate = 1.0;
  u.onstart = () => { speaking = true; $$('d-hear').className = 'dot talk'; };
  u.onend = () => { speaking = false; $$('d-hear').className = 'dot on'; };
  u.onerror = (e) => {
    speaking = false; $$('d-hear').className = 'dot on';
    console.warn('speechSynthesis error:', e.error);
    // Chrome returns an empty voice list until the async voiceschanged event
    // fires — the very first speak() call (the wake greeting) can race it.
    // One retry a beat later covers that; a second failure is a real block
    // (muted system, no TTS engine, blocked permission).
    if (!retried) setTimeout(() => browserSpeak(text, true), 400);
    else $$('said').innerHTML = 'She said: <span>' + text + '</span> (audio blocked — check browser/system sound)';
  };
  speechSynthesis.speak(u);
}

/* ── hearing: mic → speech recognition ── */
function startHearing() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { set('d-hear', 's-hear', false, 'no SpeechRecognition in this browser'); return; }
  const rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  rec.onresult = async (ev) => {
    const res = ev.results[ev.results.length - 1];
    const text = res[0].transcript.trim();
    $$('heard').innerHTML = 'She heard: <span>' + text + '</span>';
    if (res.isFinal && text) {
      const reply = await think(text);
      speak(reply);
    }
  };
  rec.onend = () => { try { rec.start(); } catch (e) {} };   // keep listening
  rec.onerror = () => {};
  rec.start();
  set('d-hear', 's-hear', true, 'listening');
}

/* ── wake ── */
$$('wake').onclick = async () => {
  $$('start').remove();
  brainUp = await brainCheck();
  await startVision().catch(e => set('d-see', 's-see', false, 'camera blocked'));
  startHearing();
  speechSynthesis.getVoices();                    // warm voice list
  setTimeout(() => speak("Hey. I can see you now."), 1200);
};
</script>
