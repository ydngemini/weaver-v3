function makeFabricWeaveTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const context = canvas.getContext('2d');
  context.fillStyle = '#a8a8a8';
  context.fillRect(0, 0, 64, 64);
  for (let index = 0; index < 64; index += 4) {
    context.fillStyle = index % 8 ? '#8e8e8e' : '#bcbcbc';
    context.fillRect(index, 0, 1, 64);
    context.fillStyle = index % 8 ? '#b5b5b5' : '#929292';
    context.fillRect(0, index + 1, 64, 1);
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.name = 'WeaverWovenFabricMicrotexture';
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(18, 26);
  texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  texture.needsUpdate = true;
  return texture;
}

function makeSkinMicroTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const context = canvas.getContext('2d');
  const image = context.createImageData(128, 128);
  for (let y = 0; y < 128; y++) {
    for (let x = 0; x < 128; x++) {
      const index = (y * 128 + x) * 4;
      const pore = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      const grain = pore - Math.floor(pore);
      const ridge = Math.sin(x * 0.71 + Math.sin(y * 0.31)) * 0.5 + 0.5;
      const value = Math.round(116 + grain * 22 + ridge * 9);
      image.data[index] = value;
      image.data[index + 1] = value;
      image.data[index + 2] = value;
      image.data[index + 3] = 255;
    }
  }
  context.putImageData(image, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.name = 'WeaverDeterministicSkinMicrodetail';
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(24, 24);
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  texture.needsUpdate = true;
  return texture;
}

function updateTailoredGarmentLayer() {
  if (!garmentLayer || !model) return;
  if (rig.pelvisL) rig.pelvisL.getWorldPosition(garmentPelvisLeft);
  if (rig.pelvisR) rig.pelvisR.getWorldPosition(garmentPelvisRight);
  if (rig.pelvisL && rig.pelvisR) {
    garmentPelvisLocal.copy(garmentPelvisLeft).add(garmentPelvisRight).multiplyScalar(0.5);
  } else {
    garmentPelvisLocal.copy(rig.pelvisL ? garmentPelvisLeft : garmentPelvisRight);
  }
  model.worldToLocal(garmentPelvisLocal);
  garmentLayer.position.copy(garmentPelvisLocal);

  garmentLayer.position.z += 0.012;
  garmentLayer.rotation.set(
    0.025 * skeleton.current.lean + cinematicMotion.softTissue.garmentLag * 0.34,
    cinematicMotion.softTissue.garmentLag * 0.16,
    -0.055 * skeleton.current.hipShift - cinematicMotion.softTissue.pelvicMass * 0.42,
  );
  const skirt = garmentLayer.children.find(child => child.name === 'weaver_seamless_woven_a_line_skirt');
  const lining = garmentLayer.children.find(child => child.name === 'weaver_closed_skirt_lining');
  const belt = garmentLayer.children.find(child => child.name === 'weaver_tailored_waist_piping');
  const hem = garmentLayer.children.find(child => child.name === 'weaver_tailored_hem_piping');
  // Give the cloth clearance before a raised/extended thigh reaches the shell.
  // This is deliberately pose-driven rather than a permanent size increase,
  // retaining the fitted neutral silhouette while preventing motion clipping.
  const stride = Math.max(Math.abs(skeleton.current.leftStep), Math.abs(skeleton.current.rightStep));
  const dynamicExpansion = Math.min(0.18, stride * 0.14 + Math.abs(skeleton.current.hipShift) * 0.06);
  outfitState.garmentCoverage.dynamicExpansion = Number(dynamicExpansion.toFixed(3));
  if (skirt) {
    skirt.rotation.z = cinematicMotion.softTissue.garmentLag * 0.55;
    skirt.scale.x = 1.06 + dynamicExpansion + Math.abs(cinematicMotion.softTissue.garmentLag) * 0.05;
    skirt.scale.z = 0.92 + dynamicExpansion * 0.20 + Math.abs(cinematicMotion.softTissue.pelvicMass) * 0.05;
  }
  if (lining) {
    lining.rotation.z = cinematicMotion.softTissue.garmentLag * 0.55;
    lining.scale.x = 1.047 + dynamicExpansion * 0.985 + Math.abs(cinematicMotion.softTissue.garmentLag) * 0.046;
    lining.scale.z = 0.907 + dynamicExpansion * 0.19 + Math.abs(cinematicMotion.softTissue.pelvicMass) * 0.046;
  }
  if (belt) belt.scale.x = 1.06 + dynamicExpansion * 0.34;
  if (hem) hem.scale.x = 1.06 + dynamicExpansion * 0.92;
  garmentLayer.updateMatrixWorld(true);
}

      requestBrainKey();
      awake = true;
      $$('start').classList.add('awake');
      if (matchMedia('(max-width: 720px)').matches) setHudCompact(true);
      $$('wake').textContent = 'SLEEP';
      $$('wake').setAttribute('aria-pressed', 'true');
      $$('sr-status').textContent = 'Weaver is waking. Camera and microphone permission may be requested.';
      await wakeUp();
      $$('sr-status').textContent = 'Weaver is awake.';
    } else {
      awake = false;
      goToSleep();
      $$('start').classList.remove('awake');
      setHudCompact(false);
      $$('wake').textContent = 'WAKE HER UP';
      $$('wake').setAttribute('aria-pressed', 'false');
      $$('sr-status').textContent = 'Weaver is asleep. Camera and microphone are off.';
    }
  } finally {
    wakeBusy = false;
    $$('wake').setAttribute('aria-busy', 'false');
  }
};
</script>
</body>
</html>
